name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # The real embedding model (torch) is stubbed in tests, so it is not installed here.
        run: pip install pypdf chromadb numpy requests python-dotenv pytest
      - name: Run tests
        run: python -m pytest -q
